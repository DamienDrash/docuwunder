<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocuWunder</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="DocuWunder – die freundliche, unabhängige Oberfläche für Paperless-ngx.">

<!--
  Installierbare App.

  viewport-fit=cover oben laesst die Seite bis in die Ecken des Bildschirms
  laufen; was dort vom Geraet verdeckt wird, meldet das System als
  env(safe-area-inset-*). Ausgewertet wird das in app.js, weil dort die
  Leisten sitzen, die davon betroffen sind.

  apple-mobile-web-app-status-bar-style bleibt bewusst auf "default":
  black-translucent wuerde die Seite unter die Statusleiste schieben, deren
  Schrift dann aber immer hell ist - im Hellmodus waere die Uhrzeit unlesbar.
  Mit "default" beginnt die Seite unter der Statusleiste, und diese uebernimmt
  die theme-color darunter.

  Die beiden theme-color-Angaben folgen der Systemeinstellung. Das ist die
  richtige Farbe, solange die App noch nicht laeuft - danach hat ihre eigene
  Einstellung Vorrang und leiste() unten schreibt sie um.
-->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F7FAFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1B2A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DocuWunder">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" sizes="180x180">

<link rel="stylesheet" href="./vendor/inter.css">
<link rel="stylesheet" href="./vendor/manrope.css">
<link rel="stylesheet" href="./basis.css">
</head>
<body>
<!--
  Einstiegspunkt der App.

  Es gibt eine Oberflaeche fuer alle Geraete. Sie schaltet ab WIDE_MIN (900px)
  selbst zweispaltig um - Liste links, Dokument-Detail rechts. Eine
  Geraeteweiche gibt es nicht.

  Aufbau seit der Migration weg vom DC-Runtime:

      vendor/react*      React, lokal - die App laedt nichts aus dem Netz
      vendor/htm.js      JSX-nahe Schreibweise ohne Compiler (1,2 KB)
      ui.js              Grundlage: html, stil(), Fehlerfang, starten()
      logik.js           reine Logik, ohne Browser testbar
      api.js             Zugriff auf die Paperless-API
      vorlage/*.js       die Bildschirme, nach Bereichen getrennt
      vorlage.js         setzt die Bildschirme zusammen
      app.js             Zustand und Verhalten

  Die Reihenfolge zaehlt: ui.js braucht React und htm, app.js braucht alles
  davor.
-->
<div id="app" style="position:fixed;inset:0;overflow:hidden"></div>

<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/htm.js"></script>
<script src="./ui.js"></script>
<script src="./logik.js"></script>
<script src="./api.js"></script>
<script src="./sperre.js"></script>
<script src="./scan.js"></script>
<script src="./mitglieder.js"></script>
<script src="./erfassen.js"></script>
<script src="./suche.js"></script>
<script src="./vorschau.js"></script>
<script src="./betrieb.js"></script>
<script src="./ordnung.js"></script>
<script src="./stile.js"></script>
<script src="./vorlage/tabs.js"></script>
<script src="./vorlage/dokument.js"></script>
<script src="./vorlage/ordnung.js"></script>
<script src="./vorlage/verwaltung.js"></script>
<script src="./vorlage/sheets.js"></script>
<script src="./vorlage/erfassen.js"></script>
<script src="./vorlage/onboarding.js"></script>
<script src="./vorlage/sperre.js"></script>
<script src="./vorlage.js"></script>
<script src="./app.js"></script>
<script src="./start.js"></script>
</body>
</html>
