<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocuWunder</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="DocuWunder – die freundliche, unabhängige Oberfläche für Paperless-ngx.">

<!--
  Installierbare App.

  viewport-fit=cover oben laesst die Seite bis in die Ecken des Bildschirms
  laufen; was dort vom Geraet verdeckt wird, meldet das System als
  env(safe-area-inset-*). Ausgewertet wird das in app.js, weil dort die
  Leisten sitzen, die davon betroffen sind.

  apple-mobile-web-app-status-bar-style bleibt bewusst auf "default":
  black-translucent wuerde die Seite unter die Statusleiste schieben, deren
  Schrift dann aber immer hell ist - im Hellmodus waere die Uhrzeit unlesbar.
  Mit "default" beginnt die Seite unter der Statusleiste, und diese uebernimmt
  die theme-color darunter.

  Die beiden theme-color-Angaben folgen der Systemeinstellung. Das ist die
  richtige Farbe, solange die App noch nicht laeuft - danach hat ihre eigene
  Einstellung Vorrang und leiste() unten schreibt sie um.
-->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F7FAFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1B2A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DocuWunder">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" sizes="180x180">

<link rel="stylesheet" href="./vendor/inter.css">
<link rel="stylesheet" href="./vendor/manrope.css">
<style>
/* overscroll-behavior:none nimmt dem Fenster das Nachfedern am Rand und das
   Herunterziehen zum Neuladen. Beides ist im Browser richtig und in einer
   installierten App falsch: die Listen scrollen selbst, ein Zug daran wuerde
   sonst die ganze Seite bewegen.
   touch-action:manipulation streicht die Wartezeit auf einen moeglichen
   Doppeltipp - Tippen wird dadurch spuerbar direkter. Aufziehen zum
   Vergroessern bleibt erhalten; die Viewport-Angabe verbietet es bewusst nicht. */
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#F7FAFA;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (prefers-color-scheme: dark){html,body{background:#0D1B2A}}
*{box-sizing:border-box}
input,textarea,button{font-family:inherit}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes sheetUp{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{display:none}
a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<!--
  Einstiegspunkt der App.

  Es gibt eine Oberflaeche fuer alle Geraete. Sie schaltet ab WIDE_MIN (900px)
  selbst zweispaltig um - Liste links, Dokument-Detail rechts. Eine
  Geraeteweiche gibt es nicht.

  Aufbau seit der Migration weg vom DC-Runtime:

      vendor/react*      React, lokal - die App laedt nichts aus dem Netz
      vendor/htm.js      JSX-nahe Schreibweise ohne Compiler (1,2 KB)
      ui.js              Grundlage: html, stil(), Fehlerfang, starten()
      logik.js           reine Logik, ohne Browser testbar
      api.js             Zugriff auf die Paperless-API
      vorlage/*.js       die Bildschirme, nach Bereichen getrennt
      vorlage.js         setzt die Bildschirme zusammen
      app.js             Zustand und Verhalten

  Die Reihenfolge zaehlt: ui.js braucht React und htm, app.js braucht alles
  davor.
-->
<div id="app" style="position:fixed;inset:0;overflow:hidden"></div>

<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/htm.js"></script>
<script src="./ui.js"></script>
<script src="./logik.js"></script>
<script src="./api.js"></script>
<script src="./sperre.js"></script>
<script src="./scan.js"></script>
<script src="./mitglieder.js"></script>
<script src="./stile.js"></script>
<script src="./vorlage/tabs.js"></script>
<script src="./vorlage/dokument.js"></script>
<script src="./vorlage/ordnung.js"></script>
<script src="./vorlage/verwaltung.js"></script>
<script src="./vorlage/sheets.js"></script>
<script src="./vorlage/erfassen.js"></script>
<script src="./vorlage/onboarding.js"></script>
<script src="./vorlage/sperre.js"></script>
<script src="./vorlage.js"></script>
<script src="./app.js"></script>
<script>
// Die Farben der beiden Schemata, wie sie oben im Kopf stehen. Sie faerben im
// installierten Zustand die Leisten des Systems um die App herum.
const LEISTE_HELL = '#F7FAFA';
const LEISTE_DUNKEL = '#0D1B2A';
let leisteJetzt = null;

// Die Oberflaeche meldet hierher, in welchem Schema sie tatsaechlich steht.
//
// Das ist nicht dasselbe wie die Systemeinstellung: in den App-Einstellungen
// laesst sich Hell oder Dunkel ausdruecklich waehlen. Ohne diese Rueckmeldung
// bliebe die Leiste des Systems bei der Farbe des Systemschemas stehen - im
// Browser faellt das kaum auf, in der installierten App steht dann ein heller
// Streifen ueber einer dunklen Oberflaeche.
//
// Umgeschrieben werden beide Angaben aus dem Kopf: welche davon greift,
// entscheidet die Medienabfrage, und die kennt nur das System. Dieselbe Farbe
// in beiden heisst deshalb: die Wahl in der App gilt.
function leiste(dunkel) {
  const farbe = dunkel ? LEISTE_DUNKEL : LEISTE_HELL;
  if (leisteJetzt === farbe) return;
  leisteJetzt = farbe;
  document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute('content', farbe));
  // Sichtbar ist der Hintergrund nur an den Raendern, die die Oberflaeche
  // freilaesst; er muss aber zur gewaehlten Farbe passen, nicht zum System.
  document.documentElement.style.background = farbe;
  document.body.style.background = farbe;
}

DWUi.starten(DWApp.Wurzel, '#app', { farbschema: 'System', onDark: leiste });

// Der Service Worker haelt die Huelle der App vor, damit sie ohne Netz
// startet (siehe sw.js). Er ist Zubehoer: schlaegt die Anmeldung fehl - kein
// sicherer Kontext, abgeschaltet, Privatfenster -, laeuft die App wie bisher.
//
// Der zweite Teil ist wichtiger, als er aussieht: eine installierte App wird
// nie neu geladen. iOS haelt die Seite tagelang am Leben, und ein neuer
// Service Worker tauscht den *bereits laufenden* Code nicht aus - er belegt
// nur den Cache fuer den naechsten Kaltstart. Ohne das Folgende laeuft eine
// installierte App also beliebig lange auf einem alten Stand, waehrend der
// Server laengst einen neuen ausliefert. Genau das ist passiert: behobene
// Fehler kamen nicht an, weil die App gar nicht mitbekam, dass es sie gibt.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then((reg) => {
        // Nachsehen, sobald die App in den Vordergrund kommt. Ein Wechsel
        // zwischen Apps ist der Moment, in dem ein Neuladen am wenigsten
        // stoert - und bei einer installierten App der einzige regelmaessige.
        const nachsehen = () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        };
        document.addEventListener('visibilitychange', nachsehen);
        window.addEventListener('focus', nachsehen);
      })
      .catch((e) => console.warn('Service Worker nicht angemeldet:', e));

    // Uebernimmt ein neuer Worker, laeuft im Fenster noch der alte Code.
    // Einmal neu laden holt ihn nach.
    //
    // Die Sperre gegen Schleifen ist noetig: der allererste Worker uebernimmt
    // eine bis dahin ungesteuerte Seite ebenfalls ueber dieses Ereignis. Ohne
    // sie wuerde die App bei der ersten Installation einmal neu laden, und bei
    // einem Fehler im Worker immer wieder.
    let laedtNeu = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (laedtNeu || !navigator.serviceWorker.controller) return;
      if (!sessionStorage.getItem('docuwunder.erstgesteuert')) {
        sessionStorage.setItem('docuwunder.erstgesteuert', '1');
        return;
      }
      laedtNeu = true;
      location.reload();
    });
    if (navigator.serviceWorker.controller) {
      sessionStorage.setItem('docuwunder.erstgesteuert', '1');
    }
  });
}
</script>
</body>
</html>
