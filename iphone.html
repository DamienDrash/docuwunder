<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocuWunder – Entwurfsvorschau</title>
<!-- Diese Seite ist nicht installierbar: kein Manifest, kein Symbol, kein
     Service Worker. Wer sie zum Home-Bildschirm hinzufuegt, bekaeme eine App,
     die einen Telefonrahmen um sich herum zeichnet. -->
<meta name="robots" content="noindex">
<script>
// Auf einem echten Telefon ist der nachgebaute Rahmen sinnlos: er malte eine
// Huelle mit Aussparung und Home-Strich in die echte Huelle mit Aussparung und
// Home-Strich hinein und liesse fuer die App selbst kaum Platz. Wer hier mit
// einem Telefon ankommt, will die App, nicht ihren Entwurf - und bekommt sie.
//
// Erkannt wird das Geraet nicht an seinem Namen (die Kennung luegt und altert),
// sondern an dem, worauf es hier ankommt: grober Zeiger, kein Schwebezustand,
// schmaler Bildschirm. Genau die Lage, in der der Rahmen nicht passt.
//
// Fuer den beabsichtigten Fall - den Entwurf am Telefon ansehen - haelt ?rahmen
// die Weiche offen.
(function () {
  if (location.search.indexOf('rahmen') !== -1) return;
  if (!window.matchMedia) return;
  var telefon = matchMedia('(pointer: coarse)').matches
    && matchMedia('(hover: none)').matches
    && matchMedia('(max-width: 820px)').matches;
  // replace statt href: der Entwurf soll nicht im Zurueck-Verlauf liegen, sonst
  // fuehrt eine Zurueck-Geste aus der App wieder in ihn hinein.
  if (telefon) location.replace('./index.html');
})();
</script>
<script src="./vendor/resources.js"></script>
<script src="./api.js"></script>
<script src="./support.js"></script>
</head>
<body>
<!--
  Desktop-Vorschau-Mockup der Phone-Oberflaeche.

  Diese Seite existiert nur noch als Design-Vorschau am Desktop: sie rendert die
  Phone-Komponente (mobile.dc.html) in der simulierten iOS-Huelle aus
  ios-frame.jsx (Bezel, Dynamic Island, Statusleiste, Home-Indicator).

  Der echte Einstieg ist index.html: dort laeuft dieselbe Komponente OHNE
  Huelle im vollen Viewport und schaltet ab 900px selbst auf zwei Spalten um.
  Eine Geraeteweiche gibt es nicht mehr - es entscheidet allein die Breite.

  api.js wird hier genauso geladen wie in index.html, damit die Vorschau
  dieselben echten Serverdaten zeigt und nicht im Onboarding haengen bleibt.
-->
<x-dc>
<helmet>
<link rel="stylesheet" href="./vendor/inter.css">
<style>
body{margin:0;min-height:100vh;background:#E3E3E8;display:flex;align-items:center;justify-content:center;padding:24px 0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif}
*{box-sizing:border-box}
</style>
</helmet>
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
<dc-import name="mobile" farbschema="{{ farbschema }}" start="{{ start }}" onDark="{{ onDark }}"></dc-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 560, &quot;height&quot;: 940}, &quot;farbschema&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Hell&quot;, &quot;Dunkel&quot;], &quot;default&quot;: &quot;Hell&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Darstellung&quot;}, &quot;start&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;App&quot;, &quot;Onboarding&quot;], &quot;default&quot;: &quot;App&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Prototyp&quot;}}">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { dark: (p.farbschema ?? 'Hell') === 'Dunkel' };
  }
  renderVals() {
    return {
      isDark: this.state.dark,
      farbschema: this.props.farbschema ?? 'Hell',
      start: this.props.start ?? 'App',
      // Die Phone-Komponente meldet ihren tatsaechlichen Darstellungsmodus
      // zurueck, damit die simulierte Statusleiste dazu passt.
      onDark: (d) => { if (d !== this.state.dark) this.setState({ dark: d }); }
    };
  }
}
</script>
</body>
</html>
