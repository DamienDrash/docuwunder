# Die Pruefstufen bei jedem Push.
#
# Aufgeteilt in zwei Aufgaben, weil sie verschiedene Voraussetzungen haben:
# die statischen Stufen brauchen nichts als Python und Node, die uebrigen
# einen laufenden Paperless-Server. Die statischen laufen deshalb immer und
# in Sekunden; faellt eine davon, erspart das den teuren Teil.
name: Pruefung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  statisch:
    name: Statische Stufen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Syntax
        run: python3 tests/syntax_check.py
      - name: Logik
        run: python3 tests/logik_check.py
      - name: Vorlagenbindungen
        run: python3 tests/template_check.py
      - name: Aufrufe im Zustand
        run: python3 tests/aufrufe_check.py
      - name: Huellenversion
        run: python3 tests/huelle_check.py
      - name: PWA
        run: python3 tests/pwa_check.py

  gegen_server:
    name: Gegen einen echten Server
    runs-on: ubuntu-latest
    needs: statisch
    services:
      broker:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Eine Wegwerf-Instanz. Feste Version, damit ein Update von
      # paperless-ngx den Lauf nicht ueberraschend rot faerbt - wann sie
      # steigt, entscheidet ein Commit.
      - name: Paperless starten
        run: |
          docker run -d --name paperless --network host \
            -e PAPERLESS_REDIS=redis://localhost:6379 \
            -e PAPERLESS_DBENGINE=sqlite \
            -e PAPERLESS_PORT=8099 \
            -e PAPERLESS_SECRET_KEY=pruefung \
            -e PAPERLESS_TIME_ZONE=Europe/Berlin \
            -e PAPERLESS_OCR_LANGUAGE=deu+eng \
            -e PAPERLESS_ADMIN_USER=pruefer \
            -e PAPERLESS_ADMIN_PASSWORD=pruefung12345 \
            ghcr.io/paperless-ngx/paperless-ngx:2.18.4
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8099/api/ >/dev/null && break
            sleep 5
          done

      - name: Zugangsschluessel holen
        run: |
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8099/api/token/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"pruefer","password":"pruefung12345"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          echo "PAPERLESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "PAPERLESS_URL=http://127.0.0.1:8099/api" >> "$GITHUB_ENV"

      - name: Playwright einrichten
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: API-Vertrag
        run: python3 tests/api_check.py
      - name: Browser
        run: python3 tests/browser_check.py

      - name: Serverprotokoll bei Fehlschlag
        if: failure()
        run: docker logs paperless | tail -80
